[project]
name = "mapcidade-cs-hub"
version = "1.0.0"
description = "Customer-success hub for a fictional municipal GIS platform (portfolio reconstruction)"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "B008",    # FastAPI's Depends()/Query() in argument defaults is the framework's idiom
  "RUF001",  # en dashes and multiplication signs in UI strings are intentional
  "RUF002",
  "RUF003",
]
